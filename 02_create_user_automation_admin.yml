---
##
## Playbook: Admin-Automation-User erstellen (automation_admin)
## Ziel: Einen dedizierten Admin-User für Automation anlegen durch:
##   - Primärgruppe bereitstellen.
##   - User mit festem UID/Home/Shell erstellen und Login mit Passwort deaktivieren.
##   - SSH Public Key vom Controller auf Zielhost kopieren.
##   - Passwordless sudo (NOPASSWD) via sudoers.d aktivieren.
##
## Ausführen (Beispiel):
##   - SSH Key auf Yubikey erstellen: "ssh-keygen -t ed25519-sk -O resident -O verify-required -C 'automation_admin@ethnode_YubiKey5C-nano_2026-02-10_01' -f ~/.ssh/id_ed25519-sk_ansible_ethnode_YubiKey5C-nano_2026-02-10_01"
##   - ansible-playbook -i inventory/hosts.yml --extra-vars="ansible_port=22" --extra-vars="ansible_user={{ system_user }}" --extra-vars="ansible_ssh_private_key_file=" --ask-pass --ask-become-pass 02_create_user_automation_admin.yml
##
## Targets: Inventory-Gruppe "ethnode"
## Privilege: become nötig für User/Sudoers-Konfiguration.
## Variablen:
##   - automation_admin_uid: feste UID des Users
##   - automation_admin_home: Home-Verzeichnis
##
## Sicherheitshinweis:
##   - Passwordless sudo ist mächtig; nur in kontrollierten Umgebungen verwenden.
##

- name: Create automation_admin user
  hosts: ethnode
  become: true
  gather_facts: false

  vars_files:
    - vars/config_project.yml
    - vars/config_untracked.yml

  tasks:
    # Primärgruppe für den User sicherstellen.
    - name: Ensure primary group exists
      group:
        name: automation_admin
        state: present

    # Admin-User mit festen Parametern anlegen (UID, Home, Shell, Passwort-Hash).
    - name: Create automation_admin user
      user:
        name: automation_admin
        uid: "{{ automation_admin_uid }}"
        group: automation_admin
        shell: /bin/bash
        home: "{{ automation_admin_home }}"
        comment: "Automation admin with full system privileges"
        create_home: yes
        password_lock: yes
        state: present

    # Sicherstellen, dass .ssh Verzeichnis mit korrekten Rechten existiert.
    - name: Ensure automation_admin .ssh directory exists with strict permissions
      file:
        path: "{{ automation_admin_home }}/.ssh"
        state: directory
        owner: automation_admin
        group: automation_admin
        mode: "0700"

    # Lokaler Public Key auf Zielhost installieren.
    - name: Install public key for automation_admin
      authorized_key:
        user: automation_admin
        state: present
        key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_ed25519-sk_ansible_ethnode_YubiKey5C-nano_2026-02-10_01.pub') }}"

    # Passwordless sudo (NOPASSWD) via /etc/sudoers.d aktivieren.
    # Hinweis: Visudo-Syntax wird durch Dateirechte und Pfad abgesichert.
    - name: Allow passwordless sudo for automation_admin
      copy:
        dest: /etc/sudoers.d/automation_admin
        content: "automation_admin ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
