---
##
## Playbook: Nimbus auf neuste Version aktualisieren
## Ziel: Beacon sicher upgraden durch:
##   - Service stoppen.
##   - letzte Linux amd64 Release von GitHub holen.
##   - Binary mit korrekten Rechten ersetzen.
##   - systemd reload bei Bedarf.
##   - Service neu starten und Version via API prüfen.
##
## Ausführen (Beispiel):
## ansible-playbook -i inventory/hosts.yml 15_update_nimbus.yml
##
## Targets: Inventory-Gruppe "ethnode"
## Privilege: become nötig für Systemmanagement.
## Variablen:
##   - nimbus_cl_system_user
##   - nimbus_cl_bin_dir
##   - nimbus_version: steuert Release-Tag (z.B. v25.12.0)
##   - nimbus_cl_rest_port
##   - system_user
## Templates:
##   - templates/nimbusCL.service.j2
## Voraussetzungen:
##   - Outbound Internet zu GitHub.
##

- name: Update Nimbus and restart Service
  hosts: ethnode
  become: true
  gather_facts: false

  vars_files:
    - vars/config_project.yml
    - vars/config_untracked.yml

  tasks:
    ###################
    # Stop nimbus

    # Service stoppen, bevor Binary getauscht wird.
    - name: Stop Nimbus service
      systemd:
        name: "{{ nimbus_cl_system_user }}"
        state: stopped

    ###########
    # Neueste Linux amd64 Release-Asset von GitHub ermitteln und laden.
    - name: Get the latest Nimbus Eth2 release URL for Linux amd64
      uri:
        url: "https://api.github.com/repos/status-im/nimbus-eth2/releases/latest"
        method: GET
        return_content: yes
        body_format: json
      register: release_data # requires installing jq on the remote host

    - name: Set binaries_url from the release data
      set_fact:
        binaries_urls: "{{ release_data.json.assets | map(attribute='browser_download_url') | select('match', '^https://github.com/status-im/nimbus-eth2/releases/download/v[0-9]+\\.[0-9]+\\.[0-9]+/nimbus-eth2_Linux_amd64_.*\\.tar\\.gz$') | list }}"

    - name: Set first match
      set_fact:
        binaries_url: "{{ binaries_urls | first | default('') }}"

    - name: Display binaries_url
      debug:
        msg: "{{ binaries_url }}"

    - name: Download the Nimbus Eth2 tar.gz
      get_url:
        url: "{{ binaries_url }}"
        dest: "/tmp/nimbus.tar.gz"

    - name: Verify tarball is gzip
      command:
        cmd: "file /tmp/nimbus.tar.gz"
      register: tar_type
      changed_when: false

    - name: Fail if tarball is not gzip
      fail:
        msg: "Downloaded file is not a gzip archive"
      when: "'gzip compressed' not in tar_type.stdout"

    # Temporär entpacken.
    - name: Ensure the destination directory exists
      file:
        path: "/home/{{ system_user }}/nimbus"
        state: directory
        owner: "{{ system_user }}"
        group: "{{ system_user }}"
        mode: "0755"

    - name: Extract Nimbus Eth2 tar.gz to the home directory
      unarchive:
        src: "/tmp/nimbus.tar.gz"
        dest: "/home/{{ system_user }}/nimbus"
        owner: "{{ nimbus_cl_system_user }}"
        group: "{{ nimbus_cl_system_user }}"
        remote_src: yes
        extra_opts: [--strip-components=1] # Assuming the tar structure allows this, adjust if needed

    - name: Cleanup downloaded tar.gz
      file:
        path: "/tmp/nimbus.tar.gz"
        state: absent

    # Nimbus CL binary an den Zielpfad verschieben.
    - name: Move Nimbus CL binary to "{{ nimbus_cl_bin_dir }}"
      command:
        cmd: "mv /home/{{ system_user }}/nimbus/build/nimbus_beacon_node {{ nimbus_cl_bin_dir }}/nimbus_beacon_node"

    # Restriktive Rechte pro Service-Binary setzen.
    - name: Set secure permissions on Nimbus CL binary
      file:
        path: "{{ nimbus_cl_bin_dir }}/nimbus_beacon_node"
        owner: "{{ nimbus_cl_system_user }}"
        group: "{{ nimbus_cl_system_user }}"
        mode: "0700"

    - name: Check nimbus_beacon_node version
      command:
        cmd: "{{ nimbus_cl_bin_dir }}/nimbus_beacon_node --version"
      register: nimbus_version

    - name: Display nimbus_beacon_node version
      debug:
        msg: "{{ nimbus_version.stdout }}"

    - name: Cleanup nimbus folder
      file:
        path: "/home/{{ system_user }}/nimbus"
        state: absent

    ##############################
    # Copy Service Template File

    # systemd-Units aktualisieren (no-op falls identisch).
    - name: Copy service script
      template:
        src: "templates/{{ nimbus_cl_system_user }}.service.j2"
        dest: "/etc/systemd/system/{{ nimbus_cl_system_user }}.service"
        owner: root
        group: root
        mode: "0644"

    ###################
    # Starte nimbus

    # Service nach dem Upgrade starten.
    - name: Restart Nimbus service
      systemd:
        name: "{{ nimbus_cl_system_user }}"
        state: restarted
        daemon_reload: yes

    # Beacon booten lassen, dann die Version via REST API abfragen.
    - name: Pause for 30 seconds for Nimbus to start
      pause:
        seconds: 30

    - name: Fetch and display the Nimbus node version
      shell: |
        curl -s http://{{ server_ip }}:{{ nimbus_cl_rest_port }}/eth/v1/node/version | jq -r '.data.version'
      register: node_version
      failed_when: node_version.rc != 0
      changed_when: false

    - name: Make sure Nimbus is running
      assert:
        that: node_version.stdout is defined and node_version.stdout != ""
        fail_msg: "'Nimbus is not running"
        success_msg: "Running Nimbus version is: {{ node_version.stdout }}"
