---
##
## Playbook: Reth (Execution Layer) installieren
## Ziel: Host für Reth EL vorbereiten durch:
##   - dedizierten System-User anlegen.
##   - reth Binary von GitHub Releases herunterladen und installieren.
##   - systemd-Service installieren und starten.
##
## Ausführen (Beispiel):
## ansible-playbook -i inventory/hosts.yml 31_install_reth.yml
##
## Targets: Inventory-Gruppe "ethnode"
## Privilege: become nötig für Benutzerverwaltung und Systemmanagement.
## Variablen:
##   - reth_system_user
##   - reth_bin_dir, reth_binary_path
##   - reth_log_dir
##   - reth_data_dir
##   - reth_version: steuert Release-Tag (z.B. v1.9.3)
##   - system_user
## Template:
##   - templates/rethEL.service.j2
## Voraussetzungen:
##   - Outbound Internet zu GitHub.
##

- name: Install reth
  hosts: ethnode
  become: true
  gather_facts: false

  vars_files:
    - vars/config_project.yml
    - vars/config_untracked.yml

  tasks:
    #################
    # Service-Gruppen und Service-User für reth anlegen.
    - name: Ensure group for reth exists
      group:
        name: "{{ reth_system_user }}"
        state: present

    - name: Ensure dedicated group for shared JWT access exists
      group:
        name: jwt
        state: present

    - name: Add the user for reth
      user:
        name: "{{ reth_system_user }}"
        group: "{{ reth_system_user }}"
        groups: jwt
        create_home: yes
        shell: /bin/bash

    ################
    # Verzeichnisse für Binary, Daten und Logs mit korrekten Rechten anlegen.
    - name: Create the reth bin directory
      file:
        path: "{{ reth_bin_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Make sure the reth data directory exists
      file:
        path: "{{ reth_data_dir }}"
        state: directory
        owner: "{{ reth_system_user }}"
        group: "{{ reth_system_user }}"
        mode: "0700"

    - name: Ensure the log file directory exists
      file:
        path: "{{ reth_log_dir }}"
        state: directory
        owner: "{{ reth_system_user }}"
        group: "{{ reth_system_user }}"
        mode: "0755"

    ################
    # Install reth
    ###############

    # Finde die neuste Version, falls {{ reth_version }} nicht gesetzt ist.
    - name: Set {{ reth_version }} to latest version if unset
      block:
        # Release-Data von GitHub ermitteln.
        - name: Fetch the latest release data
          ansible.builtin.uri:
            url: "https://api.github.com/repos/paradigmxyz/reth/releases/latest"
            method: GET
            return_content: yes
            body_format: json
          register: release_data

        # Versionsnummer aus Release-Data extrahieren.
        - name: Set version from the release data
          set_fact:
            reth_version: "{{ release_data.json.assets | map(attribute='name') | select('match', '^reth-v[0-9]+\\.[0-9]+\\.[0-9]+-x86_64-unknown-linux-gnu\\.tar\\.gz$') | first }}"
      when: reth_version is not defined or reth_version | trim | length == 0
      changed_when: false

    - name: Construct reth download url from {{ reth_version }} variable
      set_fact:
        binary_url: "https://github.com/paradigmxyz/reth/releases/download/{{ reth_version }}/reth-{{ reth_version }}-x86_64-unknown-linux-gnu.tar.gz"

    - name: Display constructed binary_url
      ansible.builtin.debug:
        msg: "{{ binary_url }}"

    # Reth Binary von GitHub Releases herunterladen.
    - name: Download the reth binary from GitHub releases
      ansible.builtin.get_url:
        url: "{{ binary_url }}"
        dest: "/tmp/reth.tar.gz"

    # Temporär entpacken.
    - name: Ensure the destination directory exists
      ansible.builtin.file:
        path: "/home/{{ system_user }}/reth"
        state: directory
        owner: "{{ system_user }}"
        group: "{{ system_user }}"
        mode: "0755"

    - name: Extract reth tar.gz to the home directory
      ansible.builtin.unarchive:
        src: "/tmp/reth.tar.gz"
        dest: "/home/{{ system_user }}/reth"
        owner: "{{ system_user }}"
        group: "{{ system_user }}"
        remote_src: yes
        extra_opts: [--strip-components=1]

    # Download-Verzeichnis aufräumen.
    - name: Cleanup downloaded reth.tar.gz
      ansible.builtin.file:
        path: "/tmp/reth.tar.gz"
        state: absent

    ###########
    # Copy binary

    # Binary in den Zielordner verschieben und restriktive Rechte setzen.
    - name: Copy the binary to {{ reth_binary_path }}
      copy:
        src: "/home/{{ system_user }}/reth/reth"
        dest: "{{ reth_binary_path }}"
        remote_src: yes
        owner: "{{ reth_system_user }}"
        group: "{{ reth_system_user }}"
        mode: "0700"

    # Temorären reth-Ordner im Home-Verzeichnis entfernen.
    - name: Cleanup reth folder
      ansible.builtin.file:
        path: "/home/{{ system_user }}/reth"
        state: absent

    # Installierte Version anzeigen.
    - name: Check reth version
      ansible.builtin.command:
        cmd: "{{ reth_binary_path }} --version"
      register: reth_version
      changed_when: false

    - name: Display reth version
      ansible.builtin.debug:
        msg: "{{ reth_version.stdout }}"

    ##############################
    # Copy Service Template Files

    # systemd-Units aus Templates installieren und aktivieren.
    - name: Copy service script
      template:
        src: templates/{{ reth_system_user }}.service.j2
        dest: /etc/systemd/system/{{ reth_system_user }}.service
        owner: root
        group: root
        mode: "0644"
      notify: daemon-reload

    ###################
    # Starte reth

    # Service nach der installation starten.
    - name: Restart "{{ reth_system_user }}" service and enable it on reboots
      systemd:
        name: "{{ reth_system_user }}"
        state: restarted
        enabled: yes

  handlers:
    # systemd neu laden, wenn Templates geändert wurden.
    - name: daemon-reload
      systemd:
        daemon_reload: yes
