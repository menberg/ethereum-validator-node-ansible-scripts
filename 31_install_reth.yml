---
##
## Playbook: Reth (Execution Layer) installieren
## Ziel: Host für Reth EL vorbereiten durch
##   - dedizierten System-User anlegen
##   - reth Binary von GitHub Releases herunterladen und installieren
##   - systemd-Service installieren und starten
##
## Ausführen (Beispiel):
## ansible-playbook -i inventory/hosts.yml 31_install_reth.yml
##
## Targets: Inventory-Gruppe 'ethnode'
## Variablen:
##   - reth_system_user
##   - reth_bin_dir, reth_binary_path
##   - reth_log_dir
##   - reth_data_dir
##   - reth_version: steuert Release-Tag (z.B. v1.9.3)
##   - system_user
## Templates:
##   - templates/rethEL.service.j2
##

- name: Install reth
  hosts: ethnode
  become: true
  gather_facts: true

  vars_files:
    - vars/config_project.yml
    - vars/config_untracked.yml

  tasks:
    #################
    # Service-Gruppen und Service-User für reth anlegen.
    - name: Ensure group for reth exists
      group:
        name: "{{ reth_system_user }}"
        state: present

    - name: Ensure dedicated group for shared JWT access exists
      group:
        name: jwt
        state: present

    - name: Add the user for reth
      user:
        name: "{{ reth_system_user }}"
        group: "{{ reth_system_user }}"
        groups: jwt
        shell: /bin/bash
        create_home: yes

    ################
    # Verzeichnisse für Binary, Daten und Logs mit korrekten Rechten anlegen.
    - name: Ensure needed directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ reth_system_user }}"
        group: "{{ reth_system_user }}"
      loop:
        - "{{ reth_bin_dir }}"
        - "{{ reth_data_dir }}"

    - name: Ensure the log file directory exists
      file:
        path: "{{ reth_log_dir }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    ###############
    # Neueste Release-Asset von GitHub ermitteln und laden.
    # Reth Binary von GitHub Releases herunterladen.
    - name: Get the latest reth release URL for Linux amd64
      ansible.builtin.uri:
        url: "https://api.github.com/repos/paradigmxyz/reth/releases/latest"
        method: GET
        return_content: yes
        body_format: json
      register: release_data
      # requires installing jq on the remote host

    - name: Set binary_url from the release data
      set_fact:
        binary_urls: "{{ release_data.json.assets | map(attribute='browser_download_url') | select('match', '^https://github.com/paradigmxyz/reth/releases/download/v[0-9]+\\.[0-9]+\\.[0-9]+/reth-v[0-9]+\\.[0-9]+\\.[0-9]+-aarch64-unknown-linux-gnu\\.tar\\.gz$') | list }}"
    - name: Set first match
      set_fact:
        binary_url: "{{ binary_urls | first | default('') }}"

    - name: Display binary_url
      ansible.builtin.debug:
        msg: "{{ binary_url }}"

    - name: Download the reth tar.gz
      ansible.builtin.get_url:
        url: "{{ binary_url }}"
        dest: "/tmp/reth.tar.gz"

    # Temporär entpacken, später Binary nach {{ reth_bin_dir }} verschieben.
    - name: Ensure the destination directory exists
      ansible.builtin.file:
        path: "/home/{{ system_user }}/reth"
        state: directory
        owner: "{{ system_user }}"
        group: "{{ system_user }}"
        mode: "0755"

    - name: Extract reth tar.gz to the home directory
      ansible.builtin.unarchive:
        src: "/tmp/reth.tar.gz"
        dest: "/home/{{ system_user }}/reth"
        owner: "{{ system_user }}"
        group: "{{ system_user }}"
        remote_src: yes
        extra_opts: [--strip-components=1] # Assuming the tar structure allows this, adjust if needed

    - name: Cleanup downloaded tar.gz
      ansible.builtin.file:
        path: "/tmp/reth.tar.gz"
        state: absent

    # Binary in das Zielverzeichnis verschieben.
    - name: Move reth binary to "{{ reth_binary_path }}"
      ansible.builtin.command:
        cmd: "mv /home/{{ system_user }}/reth/reth {{ reth_binary_path  }}"

    # Binary mit restriktiven Rechten betreiben.
    - name: Set secure permissions on reth binary
      ansible.builtin.file:
        path: "{{ reth_binary_path }}"
        owner: "{{ reth_system_user }}"
        group: "{{ reth_system_user }}"
        mode: "0700"

    - name: Check reth version
      ansible.builtin.command:
        cmd: "{{ reth_binary_path }} --version"
      register: reth_version

    - name: Display reth version
      ansible.builtin.debug:
        msg: "{{ reth_version.stdout }}"

    - name: Cleanup reth folder
      ansible.builtin.file:
        path: "/home/{{ system_user }}/reth"
        state: absent

    ##############################
    # Copy Serivice Template Files

    # systemd-Unit aus Template installieren und aktivieren.
    - name: Copy service script
      template:
        src: templates/{{ reth_system_user }}.service.j2
        dest: /etc/systemd/system/{{ reth_system_user }}.service
        owner: root
        group: root
        mode: "0664"
      notify: daemon-reload

    - name: Start {{ reth_system_user }} service
      systemd:
        name: "{{ reth_system_user }}"
        state: restarted

    - name: Enable {{ reth_system_user }} service to start on boot
      systemd:
        name: "{{ reth_system_user }}"
        enabled: yes

  handlers:
    # Handler für systemd-Reload.
    - name: daemon-reload
      systemd:
        daemon_reload: yes
