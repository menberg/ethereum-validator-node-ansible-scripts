---
##
## Playbook: OS-Hardening, SSH-Setup und UFW-Basisregeln
## Ziel: Frischen Host für den ersten Validator-Run vorbereiten durch
## - UFW mit Default-Deny aktivieren
## - Reboot zum Anwenden aller Änderungen
##
## Ausführen (Beispiel):
## ansible-playbook -i inventory/hosts.yml 01_setup_os_firewall_ssh.yml
##
## Targets: Inventory-Gruppe 'ethnode' (frischer Server)
## Privilege: become: yes (Root nötig für Firewall und sshd)
## Variablen:
## - lädt vars/initial_os_setup.yml
## - setzt ansible_port einmalig auf 22 für das Bootstrap
## Voraussetzungen:
## - Host ist initial über Port 22 erreichbar
##

- name: Setup OS - Config SSH Firewall User
  hosts: ethnode
  become: yes
  gather_facts: no

  vars_files:
    - vars/config_project.yml
    - vars/config_local.yml

  tasks:
    # sshd sichern (Port/Auth), Vorlage anpassen und Handler triggern.
    - name: Make local copy of current sshd_config
      copy:
        remote_src: yes
        src: "/etc/ssh/sshd_config"
        dest: "/etc/ssh/sshd_config_initaldefaults_lastbackup"

    - name: sshd configuration file update
      template:
        src: templates/sshd_config.j2
        dest: /etc/ssh/sshd_config
        backup: yes
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -T -f %s
      notify: restart-sshd

    # SSH erlauben.
    - name: UFW - Allow SSH
      ufw:
        rule: allow
        port: 22
        proto: tcp
        comment: SSH access

    # UFW Default-Deny aktivieren; weitere Ports (CL/EL) später öffnen.
    - name: UFW - Deny all other incoming traffic by default
      ufw:
        state: enabled
        policy: deny
        direction: incoming

  handlers:
    # sshd neu starten, wenn Config geändert wurde.
    - name: restart-sshd
      service:
        name: sshd
        state: restarted
