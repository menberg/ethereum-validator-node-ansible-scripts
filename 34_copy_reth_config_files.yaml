---
##
## Playbook: Reth systemd-Unit deployen
## Ziel: Aktualisierte Unit/Templates anwenden durch
## - Service stoppen
## - neue Unit kopieren
## - systemd reload und Service neu starten
##
## Ausführen (Beispiel):
## ansible-playbook -i inventory.ini 34_copy_reth_config_files.yaml
##
## Variablen: vars/config_project.yaml (reth_system_user)
## Template: templates/rethEL.service.j2
##

- name: Copy Service Config
  hosts: ethnode
  become: true
  gather_facts: false

  vars_files:
    - vars/config_project.yaml
    - vars/config_local.yaml

  tasks:
    # Service stoppen, um Unit sicher zu ersetzen.
    - name: Stop service
      systemd:
        name: "{{ reth_system_user }}"
        state: stopped

    # systemd-Unit-Template platzieren.
    - name: Copy service script
      template:
        src: templates/{{ reth_system_user }}.service.j2
        dest: /etc/systemd/system/rethEL.service
        owner: root
        group: root
        mode: "0664"

    # systemd daemon-reload für neue Unit.
    - name: daemon-reload
      systemd:
        daemon_reload: yes

    # Service neu starten, damit neue Unit aktiv ist.
    - name: Restart service
      systemd:
        name: "{{ reth_system_user }}"
        state: restarted
        enabled: yes
        daemon_reload: yes
