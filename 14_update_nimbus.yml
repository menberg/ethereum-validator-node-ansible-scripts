---
##
## Playbook: Nimbus auf neuste Version aktualisieren
## Ziel: Beacon sicher upgraden durch:
##   - Service stoppen.
##   - letzte Linux amd64 Release von GitHub holen.
##   - Binary mit korrekten Rechten ersetzen.
##   - systemd reload bei Bedarf.
##   - Service neu starten und Version via API prüfen.
##
## Ausführen (Beispiel):
## ansible-playbook -i inventory/hosts.yml 14_update_nimbus.yml
##
## Targets: Inventory-Gruppe "ethnode"
## Privilege: become nötig für Systemmanagement.
## Variablen:
##   - nimbus_cl_system_user
##   - nimbus_version: steuert Release-Tag (z.B. v25.12.0)
##   - nimbus_cl_binary_path
##   - nimbus_cl_rest_address
##   - nimbus_cl_rest_port
##   - system_user
## Templates:
##   - templates/nimbusCL.service.j2
## Voraussetzungen:
##   - Outbound Internet zu GitHub.
##

- name: Update Nimbus and restart Service
  hosts: ethnode
  become: true
  gather_facts: false

  vars_files:
    - vars/config_project.yml

  tasks:
    ###########
    # Neueste Binary von GitHub ermitteln und laden
    - name: Get the latest Nimbus Eth2 release URL for Linux amd64
      uri:
        url: "https://api.github.com/repos/status-im/nimbus-eth2/releases/latest"
        method: GET
        return_content: yes
        body_format: json
      register: release_data # requires installing jq on the remote host

    - name: Set binaries_url from the release data
      set_fact:
        binaries_urls: "{{ release_data.json.assets | map(attribute='browser_download_url') | select('match', '^https://github.com/status-im/nimbus-eth2/releases/download/v[0-9]+\\.[0-9]+\\.[0-9]+/nimbus-eth2_Linux_amd64_.*\\.tar\\.gz$') | list }}"

    - name: Set first match
      set_fact:
        binaries_url: "{{ binaries_urls | first | default('') }}"

    - name: Display binaries_url
      debug:
        msg: "{{ binaries_url }}"

    - name: Download the Nimbus Eth2 tar.gz
      get_url:
        url: "{{ binaries_url }}"
        dest: "/tmp/nimbus.tar.gz"

    - name: Verify tarball is gzip
      command:
        cmd: "file /tmp/nimbus.tar.gz"
      register: tar_type
      changed_when: false

    - name: Fail if tarball is not gzip
      fail:
        msg: "Downloaded file is not a gzip archive"
      when: "'gzip compressed' not in tar_type.stdout"

    # Temporär entpacken.
    - name: Ensure the destination directory exists
      file:
        path: "/home/{{ system_user }}/nimbus"
        state: directory
        owner: "{{ system_user }}"
        group: "{{ system_user }}"
        mode: "0755"

    - name: Extract Nimbus Eth2 tar.gz to the home directory
      unarchive:
        src: "/tmp/nimbus.tar.gz"
        dest: "/home/{{ system_user }}/nimbus"
        owner: "{{ nimbus_cl_system_user }}"
        group: "{{ nimbus_cl_system_user }}"
        remote_src: yes
        extra_opts: [--strip-components=1]

    # Entfernen der heruntergeladenen Datei.
    - name: Cleanup downloaded tar.gz
      file:
        path: "/tmp/nimbus.tar.gz"
        state: absent

    ##############################
    # Externe IP-Adresse ermitteln, falls nicht angegeben.

    - block:
        - name: Fetch public IP
          uri:
            url: https://api.ipify.org
            method: GET
            return_content: yes
            status_code: 200
          register: public_ip_output
          ignore_errors: yes

        - name: Set the public ip
          set_fact:
            nimbus_ext_ip: "{{ public_ip_output.content }}"
          when: public_ip_output.status == 200
      when: not nimbus_ext_ip

    # IP-Adresse anzeigen.
    - name: Show nimbus_ext_ip
      debug:
        var: nimbus_ext_ip

    ###################
    # Stop Nimbus, danach Binary ersetzen

    # Nimbus Service stoppen.
    - name: Stop Nimbus service
      systemd:
        name: "{{ nimbus_cl_system_user }}"
        state: stopped

    # Nimbus Binary in den Zielordner verschieben und restriktive Rechte setzen.
    - name: Copy the binary to {{ nimbus_cl_binary_path }}
      copy:
        src: "/home/{{ system_user }}/nimbus/build/nimbus_beacon_node"
        dest: "{{ nimbus_cl_binary_path }}"
        remote_src: yes
        owner: "{{ nimbus_cl_system_user }}"
        group: "{{ nimbus_cl_system_user }}"
        mode: "0700"

    # Temporären nimbus-Ordner im Home-Verzeichnis entfernen.
    - name: Cleanup nimbus folder
      file:
        path: "/home/{{ system_user }}/nimbus"
        state: absent

    ###################
    # Installierte Version anzeigen

    - name: Check nimbus_beacon_node version
      command:
        cmd: "{{ nimbus_cl_binary_path }} --version"
      register: nimbus_version

    - name: Display nimbus_beacon_node version
      debug:
        msg: "{{ nimbus_version.stdout }}"

    ##############################
    # Fee Recipient Adresse für Rocket Pool Validatoren ermitteln, falls vorhanden.

    - name: Check if Rocket Pool fee recipient file exists
      stat:
        path: "/home/{{ system_user }}/.rocketpool/data/validators/rp-fee-recipient.txt"
      register: rp_fee_file

    - name: Read Rocket Pool fee recipient address
      slurp:
        src: "/home/{{ system_user }}/.rocketpool/data/validators/rp-fee-recipient.txt"
      register: rp_fee_recipient_raw
      when: rp_fee_file.stat.exists

    - name: Set fee recipient fact
      set_fact:
        fee_recipient_wallet_address: "{{ rp_fee_recipient_raw.content | b64decode | trim }}"
      when: rp_fee_file.stat.exists

    - name: Display fee recipient address
      debug:
        msg: "Fee Recipient Address: {{ fee_recipient_wallet_address }}"

    ##############################
    # Copy Service Template File

    # systemd-Units aktualisieren (no-op falls identisch).
    - name: Copy service script
      template:
        src: "templates/{{ nimbus_cl_system_user }}.service.j2"
        dest: "/etc/systemd/system/{{ nimbus_cl_system_user }}.service"
        owner: root
        group: root
        mode: "0644"

    ###################
    # Starte Nimbus

    # Service nach dem Upgrade starten.
    - name: Restart Nimbus service
      systemd:
        name: "{{ nimbus_cl_system_user }}"
        state: restarted
        daemon_reload: yes

    ###################
    # Prüfen, ob Nimbus erfolgreich gestartet ist

    - name: Wait for Nimbus REST API to respond
      uri:
        url: "http://{{ nimbus_cl_rest_address }}:{{ nimbus_cl_rest_port }}/eth/v1/node/version"
        method: GET
        status_code: 200
        return_content: yes
      register: node_version
      retries: 12 # Number of polling attempts
      delay: 5 # Seconds between retries
      until: node_version.status == 200

    - name: Display Nimbus node version if available
      debug:
        msg: >-
          {% if node_version.status == 200 %}
            Running Nimbus version is: {{ node_version.content | from_json | json_query('data.version') }}
          {% else %}
            Nimbus REST API not reachable
          {% endif %}

    - name: Make sure Nimbus is running
      assert:
        that: node_version.content is defined and node_version.content != ""
        fail_msg: "Nimbus is not running"
        success_msg: "Nimbus successfully started"
