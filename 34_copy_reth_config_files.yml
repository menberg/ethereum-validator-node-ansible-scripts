---
##
## Playbook: Reth systemd-Unit deployen
## Ziel: Aktualisierte Unit/Templates anwenden durch:
##   - Service stoppen.
##   - neue Unit kopieren.
##   - systemd reload und Service neu starten.
##
## Ausführen (Beispiel):
## ansible-playbook -i inventory/hosts.yml 34_copy_reth_config_files.yml
##
## Targets: Inventory-Gruppe "ethnode"
## Privilege: become nötig für Systemmanagement.
## Variablen:
##   - reth_system_user
## Template:
##   - templates/rethEL.service.j2
##

- name: Copy Service Config
  hosts: ethnode
  become: true
  gather_facts: false

  vars_files:
    - vars/config_project.yml
    - vars/config_untracked.yml

  tasks:
    # Service stoppen, um Unit sicher zu ersetzen.
    - name: Stop service - "{{ reth_system_user }}"
      systemd:
        name: "{{ reth_system_user }}"
        state: stopped

    # systemd-Unit-Template platzieren.
    - name: Copy service script
      template:
        src: templates/{{ reth_system_user }}.service.j2
        dest: /etc/systemd/system/{{ reth_system_user }}.service
        owner: root
        group: root
        mode: "0644"

    # Service neu starten, damit neue Unit aktiv ist.
    - name: Restart "{{ reth_system_user }}" service
      systemd:
        name: "{{ reth_system_user }}"
        state: restarted
        daemon_reload: yes
