---
##
## Playbook: Reth aktualisieren und neu starten (Execution Layer)
## Ziel: Reth auf gewünschte Version aktualisieren durch:
##   - gewünschte Version von GitHub Releases herunterladen.
##   - laufenden Service stoppen.
##   - Binary ersetzen und Service neu starten.
##
## Ausführen (Beispiel):
## ansible-playbook -i inventory/hosts.yml 36_update_reth.yml
##
## Targets: Inventory-Gruppe "ethnode"
## Privilege: become nötig für Systemmanagement.
## Variablen: vars/config_project.yml
##   - reth_system_user
##   - reth_bin_dir, reth_binary_path
##   - reth_version: steuert Release-Tag (z.B. v1.9.3)
##   - reth_data_dir
## Template:
##   - templates/rethEL.service.j2
## Voraussetzungen:
##   - Outbound Internet zu GitHub.
##

- name: Update reth binary and restart Service
  hosts: ethnode
  become: true
  gather_facts: false

  vars_files:
    - vars/config_project.yml
    - vars/config_untracked.yml

  tasks:
    ################
    # Update reth

    # Download-Verzeichnis sicherstellen.
    - name: Ensure download directory exists
      file:
        path: "/tmp/reth_download"
        state: directory
        mode: "0755"
        owner: "{{ reth_system_user }}"
        group: "{{ reth_system_user }}"

    # Reth Binary von GitHub Releases herunterladen.
    - name: Download reth binary from GitHub releases
      get_url:
        url: "https://github.com/paradigmxyz/reth/releases/download/{{ reth_version }}/reth-{{ reth_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/reth_download/reth-{{ reth_version }}-x86_64-unknown-linux-gnu.tar.gz"
        mode: "0644"
        owner: "{{ reth_system_user }}"
        group: "{{ reth_system_user }}"

    # Tarball extrahieren.
    - name: Extract reth binary tarball
      unarchive:
        src: "/tmp/reth_download/reth-{{ reth_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/reth_download"
        remote_src: yes
        owner: "{{ reth_system_user }}"
        group: "{{ reth_system_user }}"

    ########## Stop Reth and replace ############

    # Service stoppen, um Binary sicher zu ersetzen.
    - name: Stop {{ reth_system_user }} service
      systemd:
        name: "{{ reth_system_user }}"
        state: stopped

    # Neues Binary an Zielpfad kopieren.
    - name: Copy the binary to the target directory
      copy:
        src: "/tmp/reth_download/reth-{{ reth_version }}-x86_64-unknown-linux-gnu/reth"
        dest: "{{ reth_binary_path }}"
        remote_src: yes
        mode: "0755"
        owner: "{{ reth_system_user }}"
        group: "{{ reth_system_user }}"

    - name: Adjust ownership of the reth directories and binary
      file:
        path: "{{ item }}"
        owner: "{{ reth_system_user }}"
        group: "{{ reth_system_user }}"
        recurse: yes
      loop:
        - "{{ reth_bin_dir }}"
        - "{{ reth_data_dir }}"

    # Download-Verzeichnis aufräumen.
    - name: Cleanup the download directory
      file:
        path: "/tmp/reth_download"
        state: absent

    ##############################
    # Copy Serivice Template Files

    # systemd-Unit aus Template aktualisieren.
    - name: Copy service script
      template:
        src: templates/{{ reth_system_user }}.service.j2
        dest: /etc/systemd/system/{{ reth_system_user }}.service
        owner: root
        group: root
        mode: "0664"
      notify: daemon-reload

    # Service neu starten, damit das neue Binary läuft.
    - name: Start {{ reth_system_user }} service
      systemd:
        name: "{{ reth_system_user }}"
        state: restarted

  handlers:
    # Handler für systemd-Reload.
    - name: daemon-reload
      systemd:
        daemon_reload: yes
