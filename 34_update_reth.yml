---
##
## Playbook: Reth aktualisieren und neu starten (Execution Layer)
## Ziel: Reth auf gewünschte Version aktualisieren durch:
##   - gewünschte Version von GitHub Releases herunterladen.
##   - laufenden Service stoppen.
##   - Binary ersetzen und Service neu starten.
##
## Ausführen (Beispiel):
## ansible-playbook -i inventory/hosts.yml 34_update_reth.yml
##
## Targets: Inventory-Gruppe "ethnode"
## Privilege: become nötig für Systemmanagement.
## Variablen: vars/config_project.yml
##   - reth_system_user
##   - reth_bin_dir, reth_binary_path
##   - reth_data_dir
##   - reth_version: steuert Release-Tag (z.B. v1.9.3)
## Template:
##   - templates/rethEL.service.j2
## Voraussetzungen:
##   - Outbound Internet zu GitHub.
##

- name: Update reth binary and restart Service
  hosts: ethnode
  become: true
  gather_facts: false

  vars_files:
    - vars/config_project.yml

  tasks:
    ################
    # Update reth

    # Finde die neuste Version, falls {{ reth_version }} nicht gesetzt ist.
    - name: Set {% raw %}{{ reth_version }}{% endraw %} to latest version if unset
      block:
        # Release-Data von GitHub ermitteln.
        - name: Fetch the latest release data
          uri:
            url: "https://api.github.com/repos/paradigmxyz/reth/releases/latest"
            method: GET
            return_content: yes
            body_format: json
          register: release_data

        # Dateiname aus Release-Data extrahieren.
        - name: Find file name from release data
          set_fact:
            reth_filename: "{{ release_data.json.assets | map(attribute='name') | select('match', '^reth-v[0-9]+\\.[0-9]+\\.[0-9]+-x86_64-unknown-linux-gnu\\.tar\\.gz$') | first }}"

        # Versionsnummer aus Dateinamen extrahieren.
        - name: Extract version from file name
          set_fact:
            reth_version: "{{ reth_filename | regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+') }}"
      when: reth_version is not defined or reth_version | trim | length == 0

    - name: Construct reth download url
      set_fact:
        binary_url: "https://github.com/paradigmxyz/reth/releases/download/{{ reth_version }}/reth-{{ reth_version }}-x86_64-unknown-linux-gnu.tar.gz"

    - name: Display constructed binary_url
      debug:
        msg: "{{ binary_url }}"

    # Reth Binary von GitHub Releases herunterladen.
    - name: Download the reth binary from GitHub releases
      get_url:
        url: "{{ binary_url }}"
        dest: "/tmp/reth.tar.gz"

    - name: Verify tarball is gzip
      command:
        cmd: "file /tmp/reth.tar.gz"
      register: tar_type
      changed_when: false

    - name: Fail if tarball is not gzip
      fail:
        msg: "Downloaded file is not a gzip archive"
      when: "'gzip compressed' not in tar_type.stdout"

    # Temporär entpacken.
    - name: Ensure the destination directory exists
      file:
        path: "/home/{{ system_user }}/reth"
        state: directory
        owner: "{{ system_user }}"
        group: "{{ system_user }}"
        mode: "0755"

    - name: Extract reth tar.gz to the home directory
      command:
        cmd: "tar -xzf /tmp/reth.tar.gz -C /home/{{ system_user }}/reth"
      args:
        creates: "/home/{{ system_user }}/reth/reth"

    # Entfernen der heruntergeladenen Datei.
    - name: Cleanup downloaded reth.tar.gz
      file:
        path: "/tmp/reth.tar.gz"
        state: absent

    ###########
    # Stop Reth, danach Binary ersetzen

    # Reth Service stoppen.
    - name: Stop Reth service
      systemd:
        name: "{{ reth_system_user }}"
        state: stopped

    # Reth Binary in den Zielordner verschieben und restriktive Rechte setzen.
    - name: Copy the binary to {{ reth_binary_path }}
      copy:
        src: "/home/{{ system_user }}/reth/reth"
        dest: "{{ reth_binary_path }}"
        remote_src: yes
        owner: "{{ reth_system_user }}"
        group: "{{ reth_system_user }}"
        mode: "0700"

    # Temorären reth-Ordner im Home-Verzeichnis entfernen.
    - name: Cleanup reth folder
      file:
        path: "/home/{{ system_user }}/reth"
        state: absent

    ##############################
    # Copy Service Template Files

    # systemd-Unit aus Template aktualisieren.
    - name: Copy service script
      template:
        src: templates/{{ reth_system_user }}.service.j2
        dest: /etc/systemd/system/{{ reth_system_user }}.service
        owner: root
        group: root
        mode: "0644"

    # Service neu starten, damit das neue Binary läuft.
    - name: Restart Reth service and make sure it is enabled on reboots
      systemd:
        name: "{{ reth_system_user }}"
        state: restarted
        enabled: yes
        daemon_reload: yes

    # Installierte Version überprüfen und anzeigen.
    - name: Wait for reth service to become active
      command:
        cmd: "systemctl is-active {{ reth_system_user }}"
      register: reth_is_active
      retries: 6
      delay: 2
      until: reth_is_active.stdout == 'active'
      changed_when: false

    - name: Check running reth service version as service user
      command:
        cmd: "sudo -u {{ reth_system_user }} {{ reth_binary_path }} --version"
      register: reth_running_version
      changed_when: false
      failed_when: reth_running_version.rc != 0

    - name: Display running reth version
      debug:
        msg: "{{ reth_running_version.stdout }}"
