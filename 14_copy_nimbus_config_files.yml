---
##
## Playbook: Nimbus systemd-Configs ausrollen
## Ziel: Geänderte Nimbus-Unit-Templates sicher deployen durch:
##   - Services stoppen.
##   - Templates kopieren.
##   - systemd reload und Services neu starten.
##
## Ausführen (Beispiel):
## ansible-playbook -i inventory/hosts.yml 14_copy_nimbus_config_files.yml
##
## Targets: Inventory-Gruppe "ethnode"
## Privilege: become nötig für Systemanagement.
## Templates:
##   - templates/nimbusCL.service.j2
##   - templates/nimbusValidator.service.j2
##

- name: Change Nimbus Config und Service Files
  hosts: ethnode
  become: true
  gather_facts: false

  tasks:
    # Services stoppen, bevor Units ersetzt werden.
    - name: Stop service - "{{ nimbus_cl_system_user }}"
      systemd:
        name: "{{ nimbus_cl_system_user }}"
        state: stopped

    - name: Stop service - "{{ nimbus_validator_system_user }}"
      systemd:
        name: "{{ nimbus_validator_system_user }}"
        state: stopped

    ##############################
    # Copy Service Template Files

    # Neue Templates nach /etc/systemd/system/ kopieren.
    - name: Copy service script
      template:
        src: "templates/{{ item }}.service.j2"
        dest: "/etc/systemd/system/{{ item }}.service"
        owner: root
        group: root
        mode: "0664"
      loop:
        - "{{ nimbus_cl_system_user }}"
        - "{{ nimbus_validator_system_user }}"

    # systemd neu laden, damit Units erkannt werden.
    - name: daemon-reload
      systemd:
        daemon_reload: yes

        ###################
    # Starte nimbus

    # Services neu starten, damit die neue Config aktiv ist.
    - name: Start "{{ nimbus_cl_system_user }}" service
      systemd:
        name: "{{ nimbus_cl_system_user }}"
        state: started

    - name: Start "{{ nimbus_validator_system_user }}" service
      systemd:
        name: "{{ nimbus_validator_system_user }}"
        state: started
