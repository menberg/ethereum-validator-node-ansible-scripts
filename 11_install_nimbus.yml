---
##
## Playbook: Nimbus installieren (Consensus Layer + Validator)
## Ziel: Validator-Host mit Nimbus CL/VC provisionieren durch:
##   - Anlegen von Service-Usern und Verzeichnissen.
##   - Basis-Pakete (chrony) installieren.
##   - letzte Nimbus-Binaries von GitHub Releases laden.
##   - Binaries sicher nach nimbus_cl_bin_dir und nimbus_validator_bin_dir legen.
##   - systemd-Services für Beacon und Validator deployen/aktivieren.
##
## Ausführen (Beispiel):
## ansible-playbook -i inventory/hosts.yml 11_install_nimbus.yml
##
## Targets: Inventory-Gruppe "ethnode"
## Privilege: become nötig für Benutzerverwaltung und Systemmanagement.
## Variablen:
##   - nimbus_cl_system_user, nimbus_validator_system_user
##   - nimbus_cl_bin_dir, nimbus_validator_bin_dir
##   - nimbus_log_dir, nimbus_cl_log_file, nimbus_validator_log_file
##   - nimbus_cl_data_dir, nimbus_validator_data_dir
##   - nimbus_validator_validators_dir, nimbus_validator_keys_dir, nimbus_validator_secrets_dir
##   - system_user
## Templates:
##   - nimbusCL.service.j2
##   - validator.service.j2
## Voraussetzungen:
##   - Outbound Internet zu GitHub.
##

- name: Install Nimbus
  hosts: ethnode
  become: true
  gather_facts: false

  vars_files:
    - vars/config_project.yml
    - vars/config_untracked.yml

  tasks:
    #################
    # Service-Gruppen und Service-User für Nimbus anlegen.
    - name: Ensure group for Nimbus CL exists
      group:
        name: "{{ nimbus_cl_system_user }}"
        state: present

    - name: Ensure group for Nimbus Validator exists
      group:
        name: "{{ nimbus_validator_system_user }}"
        state: present

    - name: Ensure dedicated group for shared JWT access exists
      group:
        name: jwt
        state: present

    - name: Add the user for Nimbus CL
      user:
        name: "{{ nimbus_cl_system_user }}"
        group: "{{ nimbus_cl_system_user }}"
        groups: jwt
        create_home: yes
        shell: /bin/bash

    - name: Add the user for Nimbus Validator
      user:
        name: "{{ nimbus_validator_system_user }}"
        group: "{{ nimbus_validator_system_user }}"
        groups: jwt
        create_home: no
        shell: /bin/bash

    ##################
    # Sicherstellen, dass chrony für Zeit-Sync installiert ist.
    - name: Make sure chrony package is installed
      package:
        name: chrony
        state: present

    ################
    # Verzeichnisse für Binaries, Daten und Logs mit korrekten Rechten anlegen.
    - name: Create the Nimbus CL bin directory
      file:
        path: "{{ nimbus_cl_bin_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Make sure the Nimbus CL data directory exists
      file:
        path: "{{ nimbus_cl_data_dir }}"
        state: directory
        owner: "{{ nimbus_cl_system_user }}"
        group: "{{ nimbus_cl_system_user }}"
        mode: "0700"

    - name: Create the Nimbus Validator bin directory
      file:
        path: "{{ nimbus_validator_bin_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Make sure needed directories for Nimbus Validator exist
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ nimbus_validator_system_user }}"
        group: "{{ nimbus_validator_system_user }}"
        mode: "0700"
      loop:
        - "{{ nimbus_validator_data_dir }}"
        - "{{ nimbus_validator_validators_dir }}"
        - "{{ nimbus_validator_keys_dir }}"
        - "{{ nimbus_validator_secrets_dir }}"

    - name: Ensure the log file directory exists
      file:
        path: "{{ nimbus_log_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure log files exist with correct ownership
      file:
        path: "{{ nimbus_log_dir }}/{{ item.file }}"
        state: touch
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "0644"
      loop:
        - {
            file: "{{ nimbus_cl_log_file }}",
            owner: "{{ nimbus_cl_system_user }}",
          }
        - {
            file: "{{ nimbus_validator_log_file }}",
            owner: "{{ nimbus_validator_system_user }}",
          }

    ###############
    # Neueste Release-Asset von GitHub ermitteln und laden.
    - name: Get the latest Nimbus Eth2 release URL for Linux amd64
      ansible.builtin.uri:
        url: "https://api.github.com/repos/status-im/nimbus-eth2/releases/latest"
        method: GET
        return_content: yes
        body_format: json
      register: release_data
      # requires installing jq on the remote host

    - name: Set binaries_url from the release data
      set_fact:
        binaries_urls: "{{ release_data.json.assets | map(attribute='browser_download_url') | select('match', '^https://github.com/status-im/nimbus-eth2/releases/download/v[0-9]+\\.[0-9]+\\.[0-9]+/nimbus-eth2_Linux_amd64_.*\\.tar\\.gz$') | list }}"
    - name: Set first match
      set_fact:
        binaries_url: "{{ binaries_urls | first | default('') }}"

    - name: Display binaries_url
      ansible.builtin.debug:
        msg: "{{ binaries_url }}"

    - name: Download the Nimbus Eth2 tar.gz
      ansible.builtin.get_url:
        url: "{{ binaries_url }}"
        dest: "/tmp/nimbus.tar.gz"

    # Temporär entpacken.
    - name: Ensure the destination directory exists
      ansible.builtin.file:
        path: "/home/{{ system_user }}/nimbus"
        state: directory
        owner: "{{ system_user }}"
        group: "{{ system_user }}"
        mode: "0755"

    - name: Extract Nimbus Eth2 tar.gz to the home directory
      ansible.builtin.unarchive:
        src: "/tmp/nimbus.tar.gz"
        dest: "/home/{{ system_user }}/nimbus"
        owner: "{{ system_user }}"
        group: "{{ system_user }}"
        remote_src: yes
        extra_opts: [--strip-components=1] # Assuming the tar structure allows this, adjust if needed

    - name: Cleanup downloaded tar.gz
      ansible.builtin.file:
        path: "/tmp/nimbus.tar.gz"
        state: absent

    # Nimbus CL binary an den Zielpfad verschieben.
    - name: Move Nimbus CL binary to "{{ nimbus_cl_bin_dir }}"
      ansible.builtin.command:
        cmd: "mv /home/{{ system_user }}/nimbus/build/nimbus_beacon_node {{ nimbus_cl_bin_dir }}/nimbus_beacon_node"

    # Nimbus Validator binary an den Zielpfad verschieben.
    - name: Move Nimbus Validator binary to "{{ nimbus_validator_bin_dir }}"
      ansible.builtin.command:
        cmd: "mv /home/{{ system_user }}/nimbus/build/nimbus_validator_client {{ nimbus_validator_bin_dir }}/nimbus_validator_client"

    # Je Dienst eigene Binary mit restriktiven Rechten betreiben.
    - name: Set secure permissions on Nimbus CL binary
      ansible.builtin.file:
        path: "{{ nimbus_cl_bin_dir }}/nimbus_beacon_node"
        owner: "{{ nimbus_cl_system_user }}"
        group: "{{ nimbus_cl_system_user }}"
        mode: "0700"

    - name: Set secure permissions on Nimbus Validator binary
      ansible.builtin.file:
        path: "{{ nimbus_validator_bin_dir }}/nimbus_validator_client"
        owner: "{{ nimbus_validator_system_user }}"
        group: "{{ nimbus_validator_system_user }}"
        mode: "0700"

    - name: Check nimbus_beacon_node version
      ansible.builtin.command:
        cmd: "{{ nimbus_cl_bin_dir }}/nimbus_beacon_node --version"
      register: nimbus_version

    - name: Display nimbus_beacon_node version
      ansible.builtin.debug:
        msg: "{{ nimbus_version.stdout }}"

    - name: Cleanup nimbus folder
      ansible.builtin.file:
        path: "/home/{{ system_user }}/nimbus"
        state: absent

    ##############################
    # Copy Service Template Files

    # systemd-Units aus Templates installieren und aktivieren.
    - name: Copy service script
      template:
        src: "templates/{{ item }}.service.j2"
        dest: "/etc/systemd/system/{{ item }}.service"
        owner: root
        group: root
        mode: "0664"
      loop:
        - "{{ nimbus_cl_system_user }}"
        - "{{ nimbus_validator_system_user }}"
      notify: daemon-reload

    - name: Start Nimbus services
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - "{{ nimbus_cl_system_user }}"
        - "{{ nimbus_validator_system_user }}"

    - name: Enable Nimbus services to start on boot
      systemd:
        name: "{{ item }}"
        enabled: yes
      loop:
        - "{{ nimbus_cl_system_user }}"
        - "{{ nimbus_validator_system_user }}"

  handlers:
    # systemd neu laden, wenn Templates geändert wurden.
    - name: daemon-reload
      systemd:
        daemon_reload: yes
