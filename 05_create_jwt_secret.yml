---
##
## Playbook: JWT Secret erstellen
## Ziel: JWT Secret für Kommunikation zwischen reth und Nimbus vorbereiten durch:
##   - Generieren von einem JWT Secret.
##   - Ablegen des Keys unter {{ jwtsecret_path }}.
##   - Dedizierte Gruppe "jwt" erstellen.
##   - Rechte setzen: nur Mitglieder der Gruppe "jwt" können das JWT Secret lesen.
##
## Ausführen (Beispiel):
## ansible-playbook -i inventory/hosts.yml 05_create_jwt_secret.yml
##
## Targets: Inventory-Gruppe "ethnode"
## Privilege: become nötig für Rechtemanagement.
## Variablen:
##   - jwtsecret_path
##

- name: Setup JWT secret
  hosts: ethnode
  become: true
  gather_facts: false

  vars_files:
    - vars/config_project.yml
    - vars/config_untracked.yml

  tasks:
    ################
    # JWT Secret für EL/CL Kommunikation erstellen
    - name: Ensure JWT secret directory exists
      file:
        path: "{{ jwtsecret_path | dirname }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Generate new JWT secret, overwrite if existing
      shell: |
        openssl rand -hex 32 | tr -d "\n" > {{ jwtsecret_path }}

    - name: Create dedicated group for shared JWT access
      group:
        name: jwt
        state: present

    - name: Set secure permissions for JWT file
      file:
        path: "{{ jwtsecret_path }}"
        mode: "0640"
        owner: root
        group: jwt
