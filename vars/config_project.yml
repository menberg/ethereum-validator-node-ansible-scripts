---
##########################################
# SYSTEM
##########################################

automation_admin_uid: 11011
automation_admin_home: /home/automation_admin
automation_admin_password_hash: "" # overridden by vars/config_local.yml

sys_packages:
  - chrony
  - git
  - curl
  - gnupg
  - build-essential
  - jq
  - ccze
  - libclang-dev
  - ufw
  - glances
  - zip
  - unzip
  - tree

##########################################
# SERVER
##########################################

## User
system_user: "janos"

# Network
server_fqdn_hostname: "ethnode.local"
localhost_ip: "127.0.0.1"
external_ip: "" # overridden by vars/config_local.yml

# Language and Timezone
config_system_locale: "de_CH.UTF-8"
config_system_language: "en_US.UTF-8"
config_system_timezone: "Europe/Zurich"

##########################################
# ETH ETHEREUM NETWORK
##########################################

network: "hoodi" # set up an environment, e.g 'hoodi' or 'mainnet'
fee_recipient_wallet_address: "" # overridden by vars/config_local.yml

##########################################
# RETH EXECUTION LAYER
##########################################
# Latest release at "https://github.com/paradigmxyz/reth/releases/latest"

reth_version: "v1.9.3"
reth_system_user: rethEL
reth_source_directory: "/tmp/reth"
reth_bin_dir: "/opt/reth/bin"
reth_binary_path: "{{ reth_bin_dir }}/reth" # Full path to the binary
reth_home_dir: "/mnt/nvme1/rethEL"
reth_data_dir: "/mnt/nvme1/rethEL/data"
reth_log_dir: "/var/log/reth"
reth_log_level: info # debug, info, warn, error
reth_ext_port: 59404
reth_max_peers_out: 20
reth_max_peers_in: 20
reth_rpc_http_port: 8547
reth_rpc_ws_port: 8548
reth_metrics_address: "{{ localhost_ip }}"
reth_metrics_port: 6060
reth_jwtsecret: "/var/lib/jwtsecret/jwt.hex"
reth_authrpc_addr: "{{ localhost_ip }}"
reth_authrpc_port: 8550
reth_http_corsdomain: "" # empty = no CORS (recommended for localhost-only), or "http://localhost,http://127.0.0.1" for browser tools
reth_ws_origins: "" # empty = no origin checking (recommended for localhost-only), or "http://localhost,http://127.0.0.1" for browser tools

##########################################
# NIMBUS CONSENSUS LAYER
##########################################
# Latest release at "https://github.com/status-im/nimbus-eth2/releases/latest"

nimbus_bin_dir: /opt/nimbus/bin

nimbus_cl_system_user: "nimbusCL"
nimbus_cl_data_dir: /opt/nimbus/nimbusCL/data
nimbus_cl_rest_port: "5050"
nimbus_cl_metrics_port: "8080"
nimbus_cl_node_name: JaNode
nimbus_ext_tcp_port: "59400"
nimbus_ext_udp_port: "59400"
nimbus_ext_ip: "{{ external_ip }}"
nimbus_max_peers: "30"
nimbus_jwt_secret: "/var/lib/jwtsecret/jwt.hex"
el_http: "http://{{ localhost_ip }}:8550"

nimbus_validator_system_user: "nimbusValidator"
nimbus_validator_data_dir: /opt/nimbus/nimbusValidator/data
nimbus_validator_secrets_dir: /opt/nimbus/nimbusValidator/secrets
nimbus_validator_validators_dir: /opt/nimbus/nimbusValidator/validators
nimbus_validator_keys_dir: /opt/nimbus/nimbusValidator/validator_keys
nimbus_validator_graffiti: "janode"

# Nimbus Logging
nimbus_log_level: "NOTICE" # DEBUG, INFO, NOTICE, WARN, ERROR
nimbus_log_dir: "/var/log/nimbus"
nimbus_cl_log_file: "nimbusCL.jsonl"
nimbus_validator_log_file: "nimbusValidator.jsonl"
