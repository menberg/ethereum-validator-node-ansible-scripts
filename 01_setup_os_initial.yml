---
##
## Playbook: Initiales OS-Setup (Hostname, Locale, Timezone, Packages)
## Ziel: Basis-Systemkonfiguration für den Validator-Host durch
## - FQDN Hostname setzen
## - Locale/Language konfigurieren
## - Zeitzone setzen
## - Standard-Packages installieren und System aktualisieren
##
## Ausführen (Beispiel):
## ansible-playbook -i inventory/hosts.yml 01_setup_os_initial.yml
##
## Targets: Inventory-Gruppe 'ethnode'
## Variablen (in vars/config_project.yml erwartet):
## - server_fqdn_hostname
## - config_system_locale
## - config_system_language
## - sys_packages (Liste von Packages)
##

- name: Initial Setup OS
  hosts: ethnode
  become: yes
  gather_facts: yes

  vars_files:
    - vars/config_project.yml
    - vars/config_local.yml

  tasks:
    # FQDN Hostname setzen.
    - name: Set the full hostname (FQDN)
      ansible.builtin.hostname:
        name: "{{ server_fqdn_hostname }}"

    # Locale-Datei generieren (z.B. en_US.UTF-8).
    - name: Ensure localisation file is available
      locale_gen:
        name: "{{ config_system_locale }}"
        state: present

    # Aktuelle Locale/Language abfragen.
    - name: Get current locale and language configuration
      command: localectl status
      register: locale_status
      changed_when: false

    # LANG aus localectl-Status extrahieren.
    - name: Parse 'LANG' from current locale and language configuration
      set_fact:
        locale_lang: "{{ locale_status.stdout | regex_search('LANG=([^\n]+)', '\\1') | first }}"

    # LANGUAGE aus localectl-Status extrahieren.
    - name: Parse 'LANGUAGE' from current locale and language configuration
      set_fact:
        locale_language: "{{ locale_status.stdout | regex_search('LANGUAGE=([^\n]+)', '\\1') | default([locale_lang], true) | first }}"

    # Locale/Language setzen (localectl), nur wenn abweichend.
    - name: Configure locale to '{{ config_system_locale }}' and language to '{{ config_system_language }}'
      command: localectl set-locale LANG={{ config_system_locale }} LANGUAGE={{ config_system_language }} LC_MESSAGES={{ config_system_locale }}
      changed_when: locale_lang != config_system_locale or locale_language != config_system_language

    # Zeitzone setzen.
    - name: Set timezone to Europe/Zurich
      timezone:
        name: "{{ config_system_timezone }}"

    # Paket-Index aktualisieren.
    - name: Run <apt-get update>
      apt:
        update_cache: yes

    # System-Pakete upgraden und bereinigen.
    - name: Run <apt-get upgrade>
      apt:
        upgrade: "yes"
        force_apt_get: yes
        autoremove: yes

    # Standard-Packages aus Variablenliste installieren.
    - name: Install Standard Packages from OS setup config vars
      apt:
        name: "{{ sys_packages }}"
        state: latest
      ignore_errors: "yes"

    # Reboot zur Anwendung der Änderungen.
    - name: Reboot host
      reboot:
      ignore_errors: "yes"
